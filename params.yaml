# Every tunable knob of the ML pipeline lives here, so changes are reviewed in Git
# and DVC knows which stages to re-run when a value changes.
prepare:
  test_size: 0.2
  seed: 42

train:
  model: random_forest        # random_forest | logistic_regression
  n_estimators: 100
  max_depth: 5
  C: 1.0                      # only used by logistic_regression
  seed: 42
  min_accuracy: 0.85          # quality gate - training fails below this
