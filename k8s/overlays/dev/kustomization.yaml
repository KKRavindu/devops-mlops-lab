apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wine-dev
resources:
  - ../../base
labels:
  - pairs: { env: dev }
    includeSelectors: false

configMapGenerator:
  - name: wine-api-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug

patches:
  - target: { kind: Deployment, name: wine-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: HorizontalPodAutoscaler, name: wine-api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
